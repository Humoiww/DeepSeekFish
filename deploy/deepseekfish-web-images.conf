# Enable only the project's built-in image runner after explicit account login.
[Unit]
Description=DeepSeekFish WebUI (Codex images only)

[Service]
Environment=FISH_CODEX_IMAGE_ONLY=1
ReadWritePaths=/srv/deepseekfish/app/runtime/codex-home
InaccessiblePaths=
# The launcher supplies private PID/proc namespaces. Host proc masks prevent
# mounting that private proc on this kernel; the image command probe is mandatory.
ProtectProc=default
ProcSubset=all
ProtectKernelTunables=no
ProtectKernelLogs=no
RestrictNamespaces=user mnt pid ipc uts net
# Native bwrap initializes loopback inside its private network namespace.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# Codex starts its own workers and native sandbox. A second executable allowlist
# breaks that runtime; filesystem/PID isolation and native permissions remain.
NoExecPaths=
ExecPaths=
# Codex's Rust workers count toward pids.max even on this two-vCPU host.
TasksMax=512
LimitNOFILE=4096
